<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panelize Verify</title>
  <!-- The Verify view is placed here by the multi-panel page that opened
       this window (same extension origin); this page runs no script. -->
  <link rel="stylesheet" href="../libs/material-symbols/material-symbols-outlined.css">
  <link rel="stylesheet" href="verify-dock.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    /* Same icon utility as multi-panel.css */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'liga';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { background: #ffffff; }
    [data-theme="dark"] body { background: #262626; }
    .pv-window-wait { padding: 24px; color: #6b6b6b; font-size: 13px; }
  </style>
</head>
<body>
  <div id="pv-window-host"><p class="pv-window-wait">Loading Verify… If this stays, close this window and click "打开 Verify" again.</p></div>
</body>
</html>
